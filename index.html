<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Match Room — Live Chess</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --felt: #16241c;
    --felt-light: #1e3327;
    --wood: #3b2620;
    --wood-dark: #2a1a16;
    --ivory: #f0e6d2;
    --walnut: #7c5a3a;
    --brass: #c9a227;
    --brass-dim: #8f7522;
    --text: #f2ecdd;
    --text-dim: #b9ad94;
    --check-red: #b0413e;
    --win-green: #4c7a52;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(circle at 50% 0%, var(--felt-light), var(--felt) 70%);
    color: var(--text);
    font-family: 'IBM Plex Mono', monospace;
    padding: 28px 18px 60px;
  }
  h1 {
    font-family: 'Playfair Display', serif;
    font-weight: 700;
    font-size: 28px;
    letter-spacing: 0.5px;
    text-align: center;
    margin: 0 0 4px;
    color: var(--brass);
  }
  .subtitle {
    text-align: center;
    color: var(--text-dim);
    font-size: 13px;
    margin-bottom: 22px;
    letter-spacing: 0.5px;
  }
  .join-bar {
    display: flex;
    justify-content: center;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 22px;
  }
  .join-bar input {
    background: var(--wood-dark);
    border: 1px solid var(--brass-dim);
    color: var(--text);
    padding: 8px 12px;
    border-radius: 4px;
    font-family: inherit;
    font-size: 13px;
  }
  .join-bar button {
    background: var(--brass);
    border: none;
    color: var(--wood-dark);
    font-weight: 600;
    padding: 8px 20px;
    border-radius: 4px;
    cursor: pointer;
    font-family: inherit;
    letter-spacing: 0.5px;
  }
  .join-bar button:hover { background: #ddb943; }

  .layout {
    display: flex;
    gap: 22px;
    justify-content: center;
    flex-wrap: wrap;
    max-width: 980px;
    margin: 0 auto;
  }

  .board-frame {
    background: linear-gradient(160deg, var(--wood), var(--wood-dark));
    border: 2px solid var(--brass-dim);
    border-radius: 10px;
    padding: 16px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.45);
  }
  #board { width: 400px; }

  .status-banner {
    margin-top: 14px;
    text-align: center;
    padding: 9px 12px;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.3px;
    background: rgba(0,0,0,0.25);
    color: var(--text-dim);
  }
  .status-banner.your-turn { background: rgba(76,122,82,0.35); color: #bfe6c4; }
  .status-banner.waiting { background: rgba(0,0,0,0.3); color: var(--text-dim); }
  .status-banner.check { background: rgba(176,65,62,0.4); color: #ffd2cf; }
  .status-banner.over { background: rgba(201,162,39,0.35); color: var(--brass); }

  .side-panel {
    width: 300px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .plaque {
    background: linear-gradient(160deg, var(--wood), var(--wood-dark));
    border: 2px solid var(--brass-dim);
    border-radius: 10px;
    padding: 14px 16px;
  }
  .plaque h2 {
    font-family: 'Playfair Display', serif;
    font-size: 14px;
    color: var(--brass);
    margin: 0 0 10px;
    letter-spacing: 0.5px;
    border-bottom: 1px solid var(--brass-dim);
    padding-bottom: 6px;
  }

  .players-row { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 6px; }
  .players-row .role-tag {
    font-size: 10px;
    padding: 1px 7px;
    border-radius: 8px;
    background: var(--brass-dim);
    color: var(--wood-dark);
    font-weight: 600;
    margin-right: 6px;
  }
  .spectator-count { font-size: 12px; color: var(--text-dim); margin-top: 6px; }

  .scoresheet {
    max-height: 260px;
    overflow-y: auto;
    font-size: 13px;
  }
  .scoresheet table { width: 100%; border-collapse: collapse; }
  .scoresheet tr:nth-child(even) { background: rgba(255,255,255,0.03); }
  .scoresheet td { padding: 3px 6px; }
  .scoresheet td.num { color: var(--text-dim); width: 26px; }
  .scoresheet td.move { cursor: default; }
  .scoresheet td.move.captured-mark::after { content: " x"; color: var(--check-red); }

  .captures-row { display: flex; gap: 2px; flex-wrap: wrap; min-height: 22px; font-size: 20px; line-height: 1; }
  .captures-label { font-size: 11px; color: var(--text-dim); margin-bottom: 4px; }

  .badge {
    display: inline-block; padding: 2px 9px; border-radius: 10px; font-size: 11px; font-weight: 600;
  }
  .badge.white { background: #ece6d6; color: #2a1a16; }
  .badge.black { background: #2a1a16; color: #ece6d6; border: 1px solid var(--brass-dim); }
  .badge.spectator { background: var(--brass-dim); color: var(--wood-dark); }

  .log { font-size: 11px; color: var(--text-dim); max-height: 100px; overflow-y: auto; }
  .log .rejected { color: #ff9d9a; }

  @media (max-width: 760px) {
    #board { width: 320px; }
    .side-panel { width: 320px; }
  }
</style>
</head>
<body>
  <h1>Match Room</h1>
  <div class="subtitle">Live, server-verified moves — spectators watch, never touch</div>

  <div class="join-bar">
    <input id="roomId" value="demo" placeholder="room name" />
    <input id="name" placeholder="your name" />
    <button id="joinBtn">Join Match</button>
    <span id="roleBadge"></span>
  </div>

  <div class="layout">
    <div>
      <div class="board-frame">
        <div id="board"></div>
      </div>
      <div id="statusBanner" class="status-banner">Not connected</div>
    </div>

    <div class="side-panel">
      <div class="plaque">
        <h2>Players</h2>
        <div class="players-row"><span><span class="badge white">White</span> <span id="whiteName">—</span></span></div>
        <div class="players-row"><span><span class="badge black">Black</span> <span id="blackName">—</span></span></div>
        <div class="spectator-count">Spectators watching: <span id="specCount">0</span> / 100</div>
      </div>

      <div class="plaque">
        <h2>Captures</h2>
        <div class="captures-label">Taken by White</div>
        <div class="captures-row" id="whiteCaptures"></div>
        <div class="captures-label" style="margin-top:8px;">Taken by Black</div>
        <div class="captures-row" id="blackCaptures"></div>
      </div>

      <div class="plaque">
        <h2>Scoresheet</h2>
        <div class="scoresheet"><table id="moveTable"></table></div>
      </div>

      <div class="plaque">
        <h2>Match Log</h2>
        <div class="log" id="log"></div>
      </div>
    </div>
  </div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.js"></script>
<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();
let board = null;
let myRole = null;
let lastFen = 'start';

const UNICODE = {
  wP:'♙', wN:'♘', wB:'♗', wR:'♖', wQ:'♕', wK:'♔',
  bP:'♟', bN:'♞', bB:'♝', bR:'♜', bQ:'♛', bK:'♚'
};

function log(msg, cls) {
  const el = document.getElementById('log');
  const line = document.createElement('div');
  if (cls) line.className = cls;
  line.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
  el.prepend(line);
}

document.getElementById('joinBtn').onclick = () => {
  const roomId = document.getElementById('roomId').value || 'demo';
  const name = document.getElementById('name').value;
  socket.emit('join_room', { roomId, name });
};

socket.on('role_assigned', (data) => {
  myRole = data.role;
  const badge = document.getElementById('roleBadge');
  badge.innerHTML = `<span class="badge ${data.role}">${data.role.toUpperCase()}</span>`;
  log(`Joined room "${data.roomId}" as ${data.role}`);

  if (!board) {
    board = Chessboard('board', {
      draggable: myRole === 'white' || myRole === 'black',
      position: 'start',
      pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png',
      onDrop: onDrop
    });
  } else {
    board.draggable = myRole === 'white' || myRole === 'black';
  }
});

socket.on('join_rejected', (data) => log(`Join rejected: ${data.reason}`, 'rejected'));

function onDrop(source, target) {
  if (myRole !== 'white' && myRole !== 'black') return 'snapback';

  const pos = board.position();
  const piece = pos[source];
  const isPromotion = piece && piece[1] === 'P' &&
    ((piece[0] === 'w' && target[1] === '8') || (piece[0] === 'b' && target[1] === '1'));

  let promotion = 'q';
  if (isPromotion) {
    const choice = (window.prompt('Promote pawn to: Q, R, B, or N', 'Q') || 'Q').trim().toLowerCase();
    promotion = ['q', 'r', 'b', 'n'].includes(choice) ? choice : 'q';
  }

  socket.emit('make_move', { from: source, to: target, promotion });
  return undefined; // wait for server's authoritative room_state to confirm/correct
}

socket.on('move_made', (data) => log(`${data.by} played ${data.san}`));

socket.on('move_rejected', (data) => {
  log(`Move rejected: ${data.reason}`, 'rejected');
  if (board) board.position(lastFen);
});

function renderScoresheet(history) {
  const table = document.getElementById('moveTable');
  let rows = '';
  for (let i = 0; i < history.length; i += 2) {
    const moveNum = i / 2 + 1;
    const white = history[i];
    const black = history[i + 1];
    rows += `<tr>
      <td class="num">${moveNum}.</td>
      <td class="move${white && white.captured ? ' captured-mark' : ''}">${white ? white.san : ''}</td>
      <td class="move${black && black.captured ? ' captured-mark' : ''}">${black ? black.san : ''}</td>
    </tr>`;
  }
  table.innerHTML = rows;
  const container = table.parentElement;
  container.scrollTop = container.scrollHeight;
}

function renderCaptures(history) {
  const whiteTook = [];
  const blackTook = [];
  history.forEach(m => {
    if (!m.captured) return;
    const capturedColor = m.color === 'w' ? 'b' : 'w';
    const symbol = UNICODE[capturedColor + m.captured.toUpperCase()];
    if (m.color === 'w') whiteTook.push(symbol); else blackTook.push(symbol);
  });
  document.getElementById('whiteCaptures').textContent = whiteTook.join(' ');
  document.getElementById('blackCaptures').textContent = blackTook.join(' ');
}

function highlightLastMove(history) {
  $('#board .square-55d63').css('box-shadow', '');
  if (!history.length) return;
  const last = history[history.length - 1];
  [last.from, last.to].forEach(sq => {
    $('#board .square-' + sq).css('box-shadow', 'inset 0 0 0 3px rgba(201,162,39,0.85)');
  });
}

function renderStatusBanner(state) {
  const el = document.getElementById('statusBanner');
  const s = state.status;
  el.className = 'status-banner';

  if (s.isCheckmate) {
    const winner = s.turn === 'white' ? 'Black' : 'White';
    el.textContent = `Checkmate — ${winner} wins`;
    el.classList.add('over');
  } else if (s.isStalemate) {
    el.textContent = 'Stalemate — draw';
    el.classList.add('over');
  } else if (s.isDraw) {
    el.textContent = 'Draw';
    el.classList.add('over');
  } else if (myRole === 'spectator') {
    el.textContent = `Spectating — ${s.turn} to move${s.isCheck ? ' — check!' : ''}`;
    el.classList.add(s.isCheck ? 'check' : 'waiting');
  } else if (myRole === s.turn) {
    el.textContent = s.isCheck ? 'Your move — you are in check!' : 'Your move';
    el.classList.add(s.isCheck ? 'check' : 'your-turn');
  } else {
    el.textContent = `Waiting for ${s.turn}${s.isCheck ? ' (in check)' : ''}`;
    el.classList.add(s.isCheck ? 'check' : 'waiting');
  }
}

socket.on('room_state', (state) => {
  lastFen = state.fen;
  if (board) board.position(state.fen);

  document.getElementById('whiteName').textContent = state.players.white || '—';
  document.getElementById('blackName').textContent = state.players.black || '—';
  document.getElementById('specCount').textContent = state.spectatorCount;

  renderScoresheet(state.history);
  renderCaptures(state.history);
  renderStatusBanner(state);
  setTimeout(() => highlightLastMove(state.history), 50); // after board repaints
});
</script>
</body>
</html>
